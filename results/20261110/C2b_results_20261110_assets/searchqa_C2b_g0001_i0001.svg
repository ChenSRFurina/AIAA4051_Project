<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1124" role="img" aria-label="searchqa / C2b / g0001_i0001" font-family="Arial, sans-serif"><defs><marker id="arr-3431f3196ed8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5e7288"/></marker></defs><rect width="1120" height="1124" fill="#ffffff"/><text x="28" y="32" font-size="20" fill="#203047" font-weight="600"><tspan x="28" dy="0">searchqa / C2b / g0001_i0001</tspan></text><rect x="430.0" y="58" width="260" height="45" rx="7" fill="#173a59"/><text x="560.0" y="86" text-anchor="middle" fill="white" font-size="16">Task-type routing</text><path d="M 560.0 103 V 124 H 185 V 148" fill="none" stroke="#5e7288" marker-end="url(#arr-3431f3196ed8)"/><rect x="30" y="150" width="310" height="167" rx="7" fill="#eaf2f9" stroke="#c9d9e7"/><text x="43" y="173" font-size="14" fill="#203047" font-weight="600"><tspan x="43" dy="0">Direct Evidence Question</tspan></text><text x="43" y="196" font-size="12" fill="#203047" font-weight="400"><tspan x="43" dy="0">Use when: The question can be answered</tspan><tspan x="43" dy="17">by locating a specific fact, phrase,</tspan><tspan x="43" dy="17">or entity directly within the context.</tspan></text><path d="M 185 317 V 349" fill="none" stroke="#5e7288" marker-end="url(#arr-3431f3196ed8)"/><rect x="50" y="352" width="270" height="58" rx="7" fill="#f5f7fa" stroke="#cbd5df"/><text x="62" y="374" font-size="13" fill="#203047" font-weight="500"><tspan x="62" dy="0">1. Parse Question</tspan></text><path d="M 185 410 V 425" fill="none" stroke="#5e7288" marker-end="url(#arr-3431f3196ed8)"/><rect x="50" y="428" width="270" height="58" rx="7" fill="#f5f7fa" stroke="#cbd5df"/><text x="62" y="450" font-size="13" fill="#203047" font-weight="500"><tspan x="62" dy="0">2. Search Context</tspan></text><path d="M 185 486 V 501" fill="none" stroke="#5e7288" marker-end="url(#arr-3431f3196ed8)"/><rect x="50" y="504" width="270" height="58" rx="7" fill="#f5f7fa" stroke="#cbd5df"/><text x="62" y="526" font-size="13" fill="#203047" font-weight="500"><tspan x="62" dy="0">3. Extract Evidence</tspan></text><path d="M 185 562 V 577" fill="none" stroke="#5e7288" marker-end="url(#arr-3431f3196ed8)"/><rect x="50" y="580" width="270" height="58" rx="7" fill="#f5f7fa" stroke="#cbd5df"/><text x="62" y="602" font-size="13" fill="#203047" font-weight="500"><tspan x="62" dy="0">4. Verify Evidence</tspan></text><path d="M 185 638 V 653" fill="none" stroke="#5e7288" marker-end="url(#arr-3431f3196ed8)"/><rect x="50" y="656" width="270" height="58" rx="7" fill="#f5f7fa" stroke="#cbd5df"/><text x="62" y="678" font-size="13" fill="#203047" font-weight="500"><tspan x="62" dy="0">5. Formulate Answer</tspan></text><path d="M 185 714 V 729" fill="none" stroke="#5e7288" marker-end="url(#arr-3431f3196ed8)"/><rect x="50" y="732" width="270" height="58" rx="7" fill="#f5f7fa" stroke="#cbd5df"/><text x="62" y="754" font-size="13" fill="#203047" font-weight="500"><tspan x="62" dy="0">6. Wrap Answer</tspan></text><path d="M 560.0 103 V 124 H 545 V 148" fill="none" stroke="#5e7288" marker-end="url(#arr-3431f3196ed8)"/><rect x="390" y="150" width="310" height="167" rx="7" fill="#eaf2f9" stroke="#c9d9e7"/><text x="403" y="173" font-size="14" fill="#203047" font-weight="600"><tspan x="403" dy="0">Negative Evidence Query</tspan></text><text x="403" y="196" font-size="12" fill="#203047" font-weight="400"><tspan x="403" dy="0">Use when: The question asks for</tspan><tspan x="403" dy="17">information that might not be present</tspan><tspan x="403" dy="17">in the context, asks for a negation</tspan><tspan x="403" dy="17">(e.g., &quot;What is NOT included...&quot;), or</tspan><tspan x="403" dy="17">asks for an entity that is absent.</tspan></text><path d="M 545 317 V 349" fill="none" stroke="#5e7288" marker-end="url(#arr-3431f3196ed8)"/><rect x="410" y="352" width="270" height="58" rx="7" fill="#f5f7fa" stroke="#cbd5df"/><text x="422" y="374" font-size="13" fill="#203047" font-weight="500"><tspan x="422" dy="0">1. Parse Question</tspan></text><path d="M 545 410 V 425" fill="none" stroke="#5e7288" marker-end="url(#arr-3431f3196ed8)"/><rect x="410" y="428" width="270" height="58" rx="7" fill="#f5f7fa" stroke="#cbd5df"/><text x="422" y="450" font-size="13" fill="#203047" font-weight="500"><tspan x="422" dy="0">2. Search Context</tspan></text><path d="M 545 486 V 501" fill="none" stroke="#5e7288" marker-end="url(#arr-3431f3196ed8)"/><rect x="410" y="504" width="270" height="58" rx="7" fill="#f5f7fa" stroke="#cbd5df"/><text x="422" y="526" font-size="13" fill="#203047" font-weight="500"><tspan x="422" dy="0">3. Verify Evidence</tspan></text><path d="M 545 562 V 577" fill="none" stroke="#5e7288" marker-end="url(#arr-3431f3196ed8)"/><rect x="410" y="580" width="270" height="58" rx="7" fill="#f5f7fa" stroke="#cbd5df"/><text x="422" y="602" font-size="13" fill="#203047" font-weight="500"><tspan x="422" dy="0">4. Formulate Answer</tspan></text><path d="M 545 638 V 653" fill="none" stroke="#5e7288" marker-end="url(#arr-3431f3196ed8)"/><rect x="410" y="656" width="270" height="58" rx="7" fill="#f5f7fa" stroke="#cbd5df"/><text x="422" y="678" font-size="13" fill="#203047" font-weight="500"><tspan x="422" dy="0">5. Wrap Answer</tspan></text><path d="M 560.0 103 V 124 H 905 V 148" fill="none" stroke="#5e7288" marker-end="url(#arr-3431f3196ed8)"/><rect x="750" y="150" width="310" height="167" rx="7" fill="#eaf2f9" stroke="#c9d9e7"/><text x="763" y="173" font-size="14" fill="#203047" font-weight="600"><tspan x="763" dy="0">Implicit Relationship Query</tspan></text><text x="763" y="196" font-size="12" fill="#203047" font-weight="400"><tspan x="763" dy="0">Use when: The question asks about a</tspan><tspan x="763" dy="17">relationship, calculation, or</tspan><tspan x="763" dy="17">derivation not explicitly stated as a</tspan><tspan x="763" dy="17">sentence but derivable from the</tspan><tspan x="763" dy="17">context (e.g., comparing values,</tspan><tspan x="763" dy="17">inferring a chain).</tspan></text><path d="M 905 317 V 349" fill="none" stroke="#5e7288" marker-end="url(#arr-3431f3196ed8)"/><rect x="770" y="352" width="270" height="58" rx="7" fill="#f5f7fa" stroke="#cbd5df"/><text x="782" y="374" font-size="13" fill="#203047" font-weight="500"><tspan x="782" dy="0">1. Parse Question</tspan></text><path d="M 905 410 V 425" fill="none" stroke="#5e7288" marker-end="url(#arr-3431f3196ed8)"/><rect x="770" y="428" width="270" height="58" rx="7" fill="#f5f7fa" stroke="#cbd5df"/><text x="782" y="450" font-size="13" fill="#203047" font-weight="500"><tspan x="782" dy="0">2. Search Context</tspan></text><path d="M 905 486 V 501" fill="none" stroke="#5e7288" marker-end="url(#arr-3431f3196ed8)"/><rect x="770" y="504" width="270" height="58" rx="7" fill="#f5f7fa" stroke="#cbd5df"/><text x="782" y="526" font-size="13" fill="#203047" font-weight="500"><tspan x="782" dy="0">3. Extract Evidence</tspan></text><path d="M 905 562 V 577" fill="none" stroke="#5e7288" marker-end="url(#arr-3431f3196ed8)"/><rect x="770" y="580" width="270" height="58" rx="7" fill="#f5f7fa" stroke="#cbd5df"/><text x="782" y="602" font-size="13" fill="#203047" font-weight="500"><tspan x="782" dy="0">4. Verify Evidence</tspan></text><path d="M 905 638 V 653" fill="none" stroke="#5e7288" marker-end="url(#arr-3431f3196ed8)"/><rect x="770" y="656" width="270" height="58" rx="7" fill="#f5f7fa" stroke="#cbd5df"/><text x="782" y="678" font-size="13" fill="#203047" font-weight="500"><tspan x="782" dy="0">5. Formulate Answer</tspan></text><path d="M 905 714 V 729" fill="none" stroke="#5e7288" marker-end="url(#arr-3431f3196ed8)"/><rect x="770" y="732" width="270" height="58" rx="7" fill="#f5f7fa" stroke="#cbd5df"/><text x="782" y="754" font-size="13" fill="#203047" font-weight="500"><tspan x="782" dy="0">6. Wrap Answer</tspan></text><text x="30" y="816" font-size="13" fill="#203047" font-weight="600"><tspan x="30" dy="0">Explicit conditions / named return edges (dashed):</tspan></text><text x="30" y="838" font-size="12" fill="#203047" font-weight="400"><tspan x="30" dy="0">Search Context: If multiple passages are relevant, prioritize the one with the most direct information.</tspan></text><text x="30" y="867" font-size="12" fill="#203047" font-weight="400"><tspan x="30" dy="0">Extract Evidence: If the question asks for a missing entity (e.g., &quot;What is...&quot;), extract the specific entity name or value from the text.</tspan></text><text x="30" y="896" font-size="12" fill="#203047" font-weight="400"><tspan x="30" dy="0">Extract Evidence: If the question asks for verification (e.g., &quot;Is...&quot;), extract the confirming sentence.</tspan></text><text x="30" y="925" font-size="12" fill="#203047" font-weight="400"><tspan x="30" dy="0">Verify Evidence: If the evidence is ambiguous, partial, or does not match the required granularity, flag it for the next step.</tspan></text><text x="30" y="954" font-size="12" fill="#203047" font-weight="400"><tspan x="30" dy="0">Verify Evidence: If the question asks for something not present, confirm that no relevant evidence exists.</tspan></text><text x="30" y="983" font-size="12" fill="#203047" font-weight="400"><tspan x="30" dy="0">Formulate Answer: If the evidence is an entity/fact, output that entity/fact directly.</tspan></text><text x="30" y="1012" font-size="12" fill="#203047" font-weight="400"><tspan x="30" dy="0">Formulate Answer: If the evidence confirms a statement, output the confirmed fact or entity.</tspan></text><text x="30" y="1041" font-size="12" fill="#203047" font-weight="400"><tspan x="30" dy="0">Formulate Answer: Remove any context-specific references (e.g., &quot;According to the text...&quot;) unless necessary for clarity.</tspan></text><text x="30" y="1070" font-size="12" fill="#203047" font-weight="400"><tspan x="30" dy="0">Wrap Answer: If no evidence was found or verification failed, enclose &quot;Not found in context&quot; in the tags.</tspan></text></svg>