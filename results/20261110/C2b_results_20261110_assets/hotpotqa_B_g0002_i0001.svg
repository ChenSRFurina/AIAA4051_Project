<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1083" role="img" aria-label="hotpotqa / B / g0002_i0001" font-family="Arial, sans-serif"><defs><marker id="arr-9444df216652" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5e7288"/></marker></defs><rect width="1120" height="1083" fill="#ffffff"/><text x="28" y="32" font-size="20" fill="#203047" font-weight="600"><tspan x="28" dy="0">hotpotqa / B / g0002_i0001</tspan></text><rect x="430.0" y="58" width="260" height="45" rx="7" fill="#173a59"/><text x="560.0" y="86" text-anchor="middle" fill="white" font-size="16">Task-type routing</text><path d="M 560.0 103 V 124 H 185 V 148" fill="none" stroke="#5e7288" marker-end="url(#arr-9444df216652)"/><rect x="30" y="150" width="310" height="167" rx="7" fill="#eaf2f9" stroke="#c9d9e7"/><text x="43" y="173" font-size="14" fill="#203047" font-weight="600"><tspan x="43" dy="0">Direct Attribute Retrieval</tspan></text><text x="43" y="196" font-size="12" fill="#203047" font-weight="400"><tspan x="43" dy="0">Use when: The question asks for a</tspan><tspan x="43" dy="17">direct attribute, definition, or</tspan><tspan x="43" dy="17">relationship of a single entity that</tspan><tspan x="43" dy="17">is explicitly mentioned in the</tspan><tspan x="43" dy="17">provided text without requiring</tspan><tspan x="43" dy="17">intermediate steps.</tspan></text><path d="M 185 317 V 349" fill="none" stroke="#5e7288" marker-end="url(#arr-9444df216652)"/><rect x="50" y="352" width="270" height="58" rx="7" fill="#f5f7fa" stroke="#cbd5df"/><text x="62" y="374" font-size="13" fill="#203047" font-weight="500"><tspan x="62" dy="0">1. Parse Goal</tspan></text><path d="M 185 410 V 425" fill="none" stroke="#5e7288" marker-end="url(#arr-9444df216652)"/><rect x="50" y="428" width="270" height="58" rx="7" fill="#f5f7fa" stroke="#cbd5df"/><text x="62" y="450" font-size="13" fill="#203047" font-weight="500"><tspan x="62" dy="0">2. Retrieve Relevant Passages</tspan></text><path d="M 185 486 V 501" fill="none" stroke="#5e7288" marker-end="url(#arr-9444df216652)"/><rect x="50" y="504" width="270" height="58" rx="7" fill="#f5f7fa" stroke="#cbd5df"/><text x="62" y="526" font-size="13" fill="#203047" font-weight="500"><tspan x="62" dy="0">3. Extract Facts</tspan></text><path d="M 185 562 V 577" fill="none" stroke="#5e7288" marker-end="url(#arr-9444df216652)"/><rect x="50" y="580" width="270" height="58" rx="7" fill="#f5f7fa" stroke="#cbd5df"/><text x="62" y="602" font-size="13" fill="#203047" font-weight="500"><tspan x="62" dy="0">4. Synthesize Final Answer</tspan></text><path d="M 185 638 V 653" fill="none" stroke="#5e7288" marker-end="url(#arr-9444df216652)"/><rect x="50" y="656" width="270" height="58" rx="7" fill="#f5f7fa" stroke="#cbd5df"/><text x="62" y="678" font-size="13" fill="#203047" font-weight="500"><tspan x="62" dy="0">5. Verify Against Context</tspan></text><path d="M 50 696 H 37 V 457 H 46" fill="none" stroke="#8a597d" stroke-dasharray="5 3" marker-end="url(#arr-9444df216652)"/><title>- If verification fails, return to `Retrieve Relevant Passages` or `Extract Facts` to find missing links.</title><path d="M 50 702 H 42 V 533 H 46" fill="none" stroke="#8a597d" stroke-dasharray="5 3" marker-end="url(#arr-9444df216652)"/><title>- If verification fails, return to `Retrieve Relevant Passages` or `Extract Facts` to find missing links.</title><path d="M 560.0 103 V 124 H 545 V 148" fill="none" stroke="#5e7288" marker-end="url(#arr-9444df216652)"/><rect x="390" y="150" width="310" height="167" rx="7" fill="#eaf2f9" stroke="#c9d9e7"/><text x="403" y="173" font-size="14" fill="#203047" font-weight="600"><tspan x="403" dy="0">Multi-Hop Chain Reasoning</tspan></text><text x="403" y="196" font-size="12" fill="#203047" font-weight="400"><tspan x="403" dy="0">Use when: The question requires</tspan><tspan x="403" dy="17">connecting multiple entities through a</tspan><tspan x="403" dy="17">chain of relationships (e.g., &quot;Who is</tspan><tspan x="403" dy="17">the spouse of the director of Movie</tspan><tspan x="403" dy="17">X?&quot;) where intermediate facts must be</tspan><tspan x="403" dy="17">inferred.</tspan></text><path d="M 545 317 V 349" fill="none" stroke="#5e7288" marker-end="url(#arr-9444df216652)"/><rect x="410" y="352" width="270" height="58" rx="7" fill="#f5f7fa" stroke="#cbd5df"/><text x="422" y="374" font-size="13" fill="#203047" font-weight="500"><tspan x="422" dy="0">1. Parse Goal</tspan></text><path d="M 545 410 V 425" fill="none" stroke="#5e7288" marker-end="url(#arr-9444df216652)"/><rect x="410" y="428" width="270" height="58" rx="7" fill="#f5f7fa" stroke="#cbd5df"/><text x="422" y="450" font-size="13" fill="#203047" font-weight="500"><tspan x="422" dy="0">2. Retrieve Relevant Passages</tspan></text><path d="M 545 486 V 501" fill="none" stroke="#5e7288" marker-end="url(#arr-9444df216652)"/><rect x="410" y="504" width="270" height="58" rx="7" fill="#f5f7fa" stroke="#cbd5df"/><text x="422" y="526" font-size="13" fill="#203047" font-weight="500"><tspan x="422" dy="0">3. Extract Facts</tspan></text><path d="M 545 562 V 577" fill="none" stroke="#5e7288" marker-end="url(#arr-9444df216652)"/><rect x="410" y="580" width="270" height="58" rx="7" fill="#f5f7fa" stroke="#cbd5df"/><text x="422" y="602" font-size="13" fill="#203047" font-weight="500"><tspan x="422" dy="0">4. Infer Intermediate</tspan><tspan x="422" dy="18">Conclusion</tspan></text><path d="M 410 620 H 397 V 457 H 406" fill="none" stroke="#8a597d" stroke-dasharray="5 3" marker-end="url(#arr-9444df216652)"/><title>- If the chain is broken or inconsistent, return to `Retrieve Relevant Passages` to find missing links.</title><path d="M 545 638 V 653" fill="none" stroke="#5e7288" marker-end="url(#arr-9444df216652)"/><rect x="410" y="656" width="270" height="58" rx="7" fill="#f5f7fa" stroke="#cbd5df"/><text x="422" y="678" font-size="13" fill="#203047" font-weight="500"><tspan x="422" dy="0">5. Synthesize Final Answer</tspan></text><path d="M 545 714 V 729" fill="none" stroke="#5e7288" marker-end="url(#arr-9444df216652)"/><rect x="410" y="732" width="270" height="58" rx="7" fill="#f5f7fa" stroke="#cbd5df"/><text x="422" y="754" font-size="13" fill="#203047" font-weight="500"><tspan x="422" dy="0">6. Verify Against Context</tspan></text><path d="M 410 772 H 397 V 457 H 406" fill="none" stroke="#8a597d" stroke-dasharray="5 3" marker-end="url(#arr-9444df216652)"/><title>- If verification fails, return to `Retrieve Relevant Passages` or `Extract Facts` to find missing links.</title><path d="M 410 778 H 402 V 533 H 406" fill="none" stroke="#8a597d" stroke-dasharray="5 3" marker-end="url(#arr-9444df216652)"/><title>- If verification fails, return to `Retrieve Relevant Passages` or `Extract Facts` to find missing links.</title><path d="M 560.0 103 V 124 H 905 V 148" fill="none" stroke="#5e7288" marker-end="url(#arr-9444df216652)"/><rect x="750" y="150" width="310" height="167" rx="7" fill="#eaf2f9" stroke="#c9d9e7"/><text x="763" y="173" font-size="14" fill="#203047" font-weight="600"><tspan x="763" dy="0">Entity Attribute Lookup</tspan></text><text x="763" y="196" font-size="12" fill="#203047" font-weight="400"><tspan x="763" dy="0">Use when: The question asks for a</tspan><tspan x="763" dy="17">specific attribute (like birth year,</tspan><tspan x="763" dy="17">name, or property) of an entity that</tspan><tspan x="763" dy="17">requires identifying the entity first</tspan><tspan x="763" dy="17">and then looking up its attribute.</tspan></text><path d="M 905 317 V 349" fill="none" stroke="#5e7288" marker-end="url(#arr-9444df216652)"/><rect x="770" y="352" width="270" height="58" rx="7" fill="#f5f7fa" stroke="#cbd5df"/><text x="782" y="374" font-size="13" fill="#203047" font-weight="500"><tspan x="782" dy="0">1. Parse Goal</tspan></text><path d="M 905 410 V 425" fill="none" stroke="#5e7288" marker-end="url(#arr-9444df216652)"/><rect x="770" y="428" width="270" height="58" rx="7" fill="#f5f7fa" stroke="#cbd5df"/><text x="782" y="450" font-size="13" fill="#203047" font-weight="500"><tspan x="782" dy="0">2. Retrieve Relevant Passages</tspan></text><path d="M 905 486 V 501" fill="none" stroke="#5e7288" marker-end="url(#arr-9444df216652)"/><rect x="770" y="504" width="270" height="58" rx="7" fill="#f5f7fa" stroke="#cbd5df"/><text x="782" y="526" font-size="13" fill="#203047" font-weight="500"><tspan x="782" dy="0">3. Extract Facts</tspan></text><path d="M 905 562 V 577" fill="none" stroke="#5e7288" marker-end="url(#arr-9444df216652)"/><rect x="770" y="580" width="270" height="58" rx="7" fill="#f5f7fa" stroke="#cbd5df"/><text x="782" y="602" font-size="13" fill="#203047" font-weight="500"><tspan x="782" dy="0">4. Infer Intermediate</tspan><tspan x="782" dy="18">Conclusion</tspan></text><path d="M 770 620 H 757 V 457 H 766" fill="none" stroke="#8a597d" stroke-dasharray="5 3" marker-end="url(#arr-9444df216652)"/><title>- If the chain is broken or inconsistent, return to `Retrieve Relevant Passages` to find missing links.</title><path d="M 905 638 V 653" fill="none" stroke="#5e7288" marker-end="url(#arr-9444df216652)"/><rect x="770" y="656" width="270" height="58" rx="7" fill="#f5f7fa" stroke="#cbd5df"/><text x="782" y="678" font-size="13" fill="#203047" font-weight="500"><tspan x="782" dy="0">5. Synthesize Final Answer</tspan></text><path d="M 905 714 V 729" fill="none" stroke="#5e7288" marker-end="url(#arr-9444df216652)"/><rect x="770" y="732" width="270" height="58" rx="7" fill="#f5f7fa" stroke="#cbd5df"/><text x="782" y="754" font-size="13" fill="#203047" font-weight="500"><tspan x="782" dy="0">6. Verify Against Context</tspan></text><path d="M 770 772 H 757 V 457 H 766" fill="none" stroke="#8a597d" stroke-dasharray="5 3" marker-end="url(#arr-9444df216652)"/><title>- If verification fails, return to `Retrieve Relevant Passages` or `Extract Facts` to find missing links.</title><path d="M 770 778 H 762 V 533 H 766" fill="none" stroke="#8a597d" stroke-dasharray="5 3" marker-end="url(#arr-9444df216652)"/><title>- If verification fails, return to `Retrieve Relevant Passages` or `Extract Facts` to find missing links.</title><text x="30" y="816" font-size="13" fill="#203047" font-weight="600"><tspan x="30" dy="0">Explicit conditions / named return edges (dashed):</tspan></text><text x="30" y="838" font-size="12" fill="#203047" font-weight="400"><tspan x="30" dy="0">Parse Goal: Determine if the question is a single-hop retrieval or a multi-hop chain requiring intermediate facts.</tspan></text><text x="30" y="867" font-size="12" fill="#203047" font-weight="400"><tspan x="30" dy="0">Retrieve Relevant Passages: If no direct match exists, look for synonyms or cross-references within the titles and first sentences.</tspan></text><text x="30" y="896" font-size="12" fill="#203047" font-weight="400"><tspan x="30" dy="0">Extract Facts: Record the fact as a triplet: (Subject, Relation, Object) if the structure permits.</tspan></text><text x="30" y="925" font-size="12" fill="#203047" font-weight="400"><tspan x="30" dy="0">Infer Intermediate Conclusion: If the question requires connecting Entity A to Entity B via Entity C, verify that the fact linking A to C and C to B</tspan><tspan x="30" dy="17">both exist in the extracted facts.</tspan></text><text x="30" y="971" font-size="12" fill="#203047" font-weight="400"><tspan x="30" dy="0">Infer Intermediate Conclusion: If the chain is broken or inconsistent, return to `Retrieve Relevant Passages` to find missing links.</tspan></text><text x="30" y="1000" font-size="12" fill="#203047" font-weight="400"><tspan x="30" dy="0">Synthesize Final Answer: If the answer is a list, ensure all items are included and formatted correctly.</tspan></text><text x="30" y="1029" font-size="12" fill="#203047" font-weight="400"><tspan x="30" dy="0">Verify Against Context: If verification fails, return to `Retrieve Relevant Passages` or `Extract Facts` to find missing links.</tspan></text></svg>