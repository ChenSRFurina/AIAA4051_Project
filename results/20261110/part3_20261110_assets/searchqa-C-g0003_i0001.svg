stroke="#cbd5df"/><text x="422" y="357" font-size="13" fill="#203047" font-weight="500"><tspan x="422" dy="0">1. Parse Question</tspan></text><path d="M 545 393 V 408" fill="none" stroke="#5e7288" marker-end="url(#arr-d75beb1db61d)"/><rect x="410" y="411" width="270" height="58" rx="7" fill="#f5f7fa" stroke="#cbd5df"/><text x="422" y="433" font-size="13" fill="#203047" font-weight="500"><tspan x="422" dy="0">2. Search Context</tspan></text><path d="M 545 469 V 484" fill="none" stroke="#5e7288" marker-end="url(#arr-d75beb1db61d)"/><rect x="410" y="487" width="270" height="58" rx="7" fill="#f5f7fa" stroke="#cbd5df"/><text x="422" y="509" font-size="13" fill="#203047" font-weight="500"><tspan x="422" dy="0">3. Extract Evidence</tspan></text><path d="M 545 545 V 560" fill="none" stroke="#5e7288" marker-end="url(#arr-d75beb1db61d)"/><rect x="410" y="563" width="270" height="58" rx="7" fill="#f5f7fa" stroke="#cbd5df"/><text x="422" y="585" font-size="13" fill="#203047" font-weight="500"><tspan x="422" dy="0">4. Verify Evidence</tspan></text><path d="M 545 621 V 636" fill="none" stroke="#5e7288" marker-end="url(#arr-d75beb1db61d)"/><rect x="410" y="639" width="270" height="58" rx="7" fill="#f5f7fa" stroke="#cbd5df"/><text x="422" y="661" font-size="13" fill="#203047" font-weight="500"><tspan x="422" dy="0">5. Formulate Answer</tspan></text><path d="M 545 697 V 712" fill="none" stroke="#5e7288" marker-end="url(#arr-d75beb1db61d)"/><rect x="410" y="715" width="270" height="58" rx="7" fill="#f5f7fa" stroke="#cbd5df"/><text x="422" y="737" font-size="13" fill="#203047" font-weight="500"><tspan x="422" dy="0">6. Wrap Answer</tspan></text><path d="M 560.0 103 V 124 H 905 V 148" fill="none" stroke="#5e7288" marker-end="url(#arr-d75beb1db61d)"/><rect x="750" y="150" width="310" height="150" rx="7" fill="#eaf2f9" stroke="#c9d9e7"/><text x="763" y="173" font-size="14" fill="#203047" font-weight="600"><tspan x="763" dy="0">Negative or Missing</tspan><tspan x="763" dy="19">Information</tspan></text><text x="763" y="215" font-size="12" fill="#203047" font-weight="400"><tspan x="763" dy="0">Use when: The question asks for</tspan><tspan x="763" dy="17">something that might not be in the</tspan><tspan x="763" dy="17">context, or explicitly asks for a</tspan><tspan x="763" dy="17">negation (e.g., &quot;What is NOT</tspan><tspan x="763" dy="17">included&quot;).</tspan></text><path d="M 905 300 V 332" fill="none" stroke="#5e7288" marker-end="url(#arr-d75beb1db61d)"/><rect x="770" y="335" width="270" height="58" rx="7" fill="#f5f7fa" stroke="#cbd5df"/><text x="782" y="357" font-size="13" fill="#203047" font-weight="500"><tspan x="782" dy="0">1. Parse Question</tspan></text><path d="M 905 393 V 408" fill="none" stroke="#5e7288" marker-end="url(#arr-d75beb1db61d)"/><rect x="770" y="411" width="270" height="58" rx="7" fill="#f5f7fa" stroke="#cbd5df"/><text x="782" y="433" font-size="13" fill="#203047" font-weight="500"><tspan x="782" dy="0">2. Search Context</tspan></text><path d="M 905 469 V 484" fill="none" stroke="#5e7288" marker-end="url(#arr-d75beb1db61d)"/><rect x="770" y="487" width="270" height="58" rx="7" fill="#f5f7fa" stroke="#cbd5df"/><text x="782" y="509" font-size="13" fill="#203047" font-weight="500"><tspan x="782" dy="0">3. Verify Evidence</tspan></text><path d="M 905 545 V 560" fill="none" stroke="#5e7288" marker-end="url(#arr-d75beb1db61d)"/><rect x="770" y="563" width="270" height="58" rx="7" fill="#f5f7fa" stroke="#cbd5df"/><text x="782" y="585" font-size="13" fill="#203047" font-weight="500"><tspan x="782" dy="0">4. Formulate Answer</tspan></text><path d="M 905 621 V 636" fill="none" stroke="#5e7288" marker-end="url(#arr-d75beb1db61d)"/><rect x="770" y="639" width="270" height="58" rx="7" fill="#f5f7fa" stroke="#cbd5df"/><text x="782" y="661" font-size="13" fill="#203047" font-weight="500"><tspan x="782" dy="0">5. Wrap Answer</tspan></text><text x="30" y="799" font-size="13" fill="#203047" font-weight="600"><tspan x="30" dy="0">Explicit conditions / named return edges (dashed):</tspan></text><text x="30" y="821" font-size="12" fill="#203047" font-weight="400"><tspan x="30" dy="0">Search Context: If multiple passages are relevant, prioritize the one with the most direct information.</tspan></text><text x="30" y="850" font-size="12" fill="#203047" font-weight="400"><tspan x="30" dy="0">Extract Evidence: If the question asks for a specific entity (e.g., a name, object) rather than a full sentence, extract the specific entity name</tspan><tspan x="30" dy="17">found.</tspan></text><text x="30" y="896" font-size="12" fill="#203047" font-weight="400"><tspan x="30" dy="0">Verify Evidence: If the evidence is ambiguous, partial, or does not match the question intent, flag it for failure.</tspan></text><text x="30" y="925" font-size="12" fill="#203047" font-weight="400"><tspan x="30" dy="0">Formulate Answer: Remove any context-specific references (e.g., &quot;According to the text...&quot;) unless necessary for clarity.</tspan></text><text x="30" y="954" font-size="12" fill="#203047" font-weight="400"><tspan x="30" dy="0">Wrap Answer: If verification failed or no evidence was found, enclose &quot;Not found in context&quot; in the tags.</tspan></text></svg>