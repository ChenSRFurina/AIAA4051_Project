<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 962" role="img" aria-label="searchqa / C / g0003_i0000 / dev EM 73.33%" font-family="Arial, sans-serif"><defs><marker id="arr-2fa1770eca8f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5e7288"/></marker></defs><rect width="1480" height="962" fill="#ffffff"/><text x="28" y="32" font-size="20" fill="#203047" font-weight="600"><tspan x="28" dy="0">searchqa / C / g0003_i0000 / dev EM 73.33%</tspan></text><rect x="610.0" y="58" width="260" height="45" rx="7" fill="#173a59"/><text x="740.0" y="86" text-anchor="middle" fill="white" font-size="16">Task-type routing</text><path d="M 740.0 103 V 124 H 185 V 148" fill="none" stroke="#5e7288" marker-end="url(#arr-2fa1770eca8f)"/><rect x="30" y="150" width="310" height="150" rx="7" fill="#eaf2f9" stroke="#c9d9e7"/><text x="43" y="173" font-size="14" fill="#203047" font-weight="600"><tspan x="43" dy="0">Direct Evidence Question</tspan></text><text x="43" y="196" font-size="12" fill="#203047" font-weight="400"><tspan x="43" dy="0">Use when: The question can be answered</tspan><tspan x="43" dy="17">by locating a specific fact or phrase</tspan><tspan x="43" dy="17">directly within the context.</tspan></text><path d="M 185 300 V 332" fill="none" stroke="#5e7288" marker-end="url(#arr-2fa1770eca8f)"/><rect x="50" y="335" width="270" height="58" rx="7" fill="#f5f7fa" stroke="#cbd5df"/><text x="62" y="357" font-size="13" fill="#203047" font-weight="500"><tspan x="62" dy="0">1. Parse Question</tspan></text><path d="M 185 393 V 408" fill="none" stroke="#5e7288" marker-end="url(#arr-2fa1770eca8f)"/><rect x="50" y="411" width="270" height="58" rx="7" fill="#f5f7fa" stroke="#cbd5df"/><text x="62" y="433" font-size="13" fill="#203047" font-weight="500"><tspan x="62" dy="0">2. Search Context</tspan></text><path d="M 185 469 V 484" fill="none" stroke="#5e7288" marker-end="url(#arr-2fa1770eca8f)"/><rect x="50" y="487" width="270" height="58" rx="7" fill="#f5f7fa" stroke="#cbd5df"/><text x="62" y="509" font-size="13" fill="#203047" font-weight="500"><tspan x="62" dy="0">3. Extract Evidence</tspan></text><path d="M 185 545 V 560" fill="none" stroke="#5e7288" marker-end="url(#arr-2fa1770eca8f)"/><rect x="50" y="563" width="270" height="58" rx="7" fill="#f5f7fa" stroke="#cbd5df"/><text x="62" y="585" font-size="13" fill="#203047" font-weight="500"><tspan x="62" dy="0">4. Verify Evidence</tspan></text><path d="M 185 621 V 636" fill="none" stroke="#5e7288" marker-end="url(#arr-2fa1770eca8f)"/><rect x="50" y="639" width="270" height="58" rx="7" fill="#f5f7fa" stroke="#cbd5df"/><text x="62" y="661" font-size="13" fill="#203047" font-weight="500"><tspan x="62" dy="0">5. Formulate Answer</tspan></text><path d="M 185 697 V 712" fill="none" stroke="#5e7288" marker-end="url(#arr-2fa1770eca8f)"/><rect x="50" y="715" width="270" height="58" rx="7" fill="#f5f7fa" stroke="#cbd5df"/><text x="62" y="737" font-size="13" fill="#203047" font-weight="500"><tspan x="62" dy="0">6. Wrap Answer</tspan></text><path d="M 740.0 103 V 124 H 545 V 148" fill="none" stroke="#5e7288" marker-end="url(#arr-2fa1770eca8f)"/><rect x="390" y="150" width="310" height="150" rx="7" fill="#eaf2f9" stroke="#c9d9e7"/><text x="403" y="173" font-size="14" fill="#203047" font-weight="600"><tspan x="403" dy="0">Multi-Hop Fact Retrieval</tspan></text><text x="403" y="196" font-size="12" fill="#203047" font-weight="400"><tspan x="403" dy="0">Use when: The question requires</tspan><tspan x="403" dy="17">combining information from different</tspan><tspan x="403" dy="17">parts of the context or inferring a</tspan><tspan x="403" dy="17">relationship between two entities</tspan><tspan x="403" dy="17">mentioned in the text.</tspan></text><path d="M 545 300 V 332" fill="none" stroke="#5e7288" marker-end="url(#arr-2fa1770eca8f)"/><rect x="410" y="335" width="270" height="58" rx="7" fill="#f5f7fa" stroke="#cbd5df"/><text x="422" y="357" font-size="13" fill="#203047" font-weight="500"><tspan x="422" dy="0">1. Parse Question</tspan></text><path d="M 545 393 V 408" fill="none" stroke="#5e7288" marker-end="url(#arr-2fa1770eca8f)"/><rect x="410" y="411" width="270" height="58" rx="7" fill="#f5f7fa" stroke="#cbd5df"/><text x="422" y="433" font-size="13" fill="#203047" font-weight="500"><tspan x="422" dy="0">2. Search Context</tspan></text><path d="M 545 469 V 484" fill="none" stroke="#5e7288" marker-end="url(#arr-2fa1770eca8f)"/><rect x="410" y="487" width="270" height="58" rx="7" fill="#f5f7fa" stroke="#cbd5df"/><text x="422" y="509" font-size="13" fill="#203047" font-weight="500"><tspan x="422" dy="0">3. Extract Evidence</tspan></text><path d="M 545 545 V 560" fill="none" stroke="#5e7288" marker-end="url(#arr-2fa1770eca8f)"/><rect x="410" y="563" width="270" height="58" rx="7" fill="#f5f7fa" stroke="#cbd5df"/><text x="422" y="585" font-size="13" fill="#203047" font-weight="500"><tspan x="422" dy="0">4. Verify Evidence</tspan></text><path d="M 545 621 V 636" fill="none" stroke="#5e7288" marker-end="url(#arr-2fa1770eca8f)"/><rect x="410" y="639" width="270" height="58" rx="7" fill="#f5f7fa" stroke="#cbd5df"/><text x="422" y="661" font-size="13" fill="#203047" font-weight="500"><tspan x="422" dy="0">5. Formulate Answer</tspan></text><path d="M 545 697 V 712" fill="none" stroke="#5e7288" marker-end="url(#arr-2fa1770eca8f)"/><rect x="410" y="715" width="270" height="58" rx="7" fill="#f5f7fa" stroke="#cbd5df"/><text x="422" y="737" font-size="13" fill="#203047" font-weight="500"><tspan x="422" dy="0">6. Wrap Answer</tspan></text><path d="M 740.0 103 V 124 H 905 V 148" fill="none" stroke="#5e7288" marker-end="url(#arr-2fa1770eca8f)"/><rect x="750" y="150" width="310" height="150" rx="7" fill="#eaf2f9" stroke="#c9d9e7"/><text x="763" y="173" font-size="14" fill="#203047" font-weight="600"><tspan x="763" dy="0">Negative Evidence Query</tspan></text><text x="763" y="196" font-size="12" fill="#203047" font-weight="400"><tspan x="763" dy="0">Use when: The question asks for</tspan><tspan x="763" dy="17">information that might not be present</tspan><tspan x="763" dy="17">in the context, or asks for a negation</tspan><tspan x="763" dy="17">(e.g., &quot;What is NOT included...&quot;).</tspan></text><path d="M 905 300 V 332" fill="none" stroke="#5e7288" marker-end="url(#arr-2fa1770eca8f)"/><rect x="770" y="335" width="270" height="58" rx="7" fill="#f5f7fa" stroke="#cbd5df"/><text x="782" y="357" font-size="13" fill="#203047" font-weight="500"><tspan x="782" dy="0">1. Parse Question</tspan></text><path d="M 905 393 V 408" fill="none" stroke="#5e7288" marker-end="url(#arr-2fa1770eca8f)"/><rect x="770" y="411" width="270" height="58" rx="7" fill="#f5f7fa" stroke="#cbd5df"/><text x="782" y="433" font-size="13" fill="#203047" font-weight="500"><tspan x="782" dy="0">2. Search Context</tspan></text><path d="M 905 469 V 484" fill="none" stroke="#5e7288" marker-end="url(#arr-2fa1770eca8f)"/><rect x="770" y="487" width="270" height="58" rx="7" fill="#f5f7fa" stroke="#cbd5df"/><text x="782" y="509" font-size="13" fill="#203047" font-weight="500"><tspan x="782" dy="0">3. Verify Evidence</tspan></text><path d="M 905 545 V 560" fill="none" stroke="#5e7288" marker-end="url(#arr-2fa1770eca8f)"/><rect x="770" y="563" width="270" height="58" rx="7" fill="#f5f7fa" stroke="#cbd5df"/><text x="782" y="585" font-size="13" fill="#203047" font-weight="500"><tspan x="782" dy="0">4. Formulate Answer</tspan></text><path d="M 905 621 V 636" fill="none" stroke="#5e7288" marker-end="url(#arr-2fa1770eca8f)"/><rect x="770" y="639" width="270" height="58" rx="7" fill="#f5f7fa" stroke="#cbd5df"/><text x="782" y="661" font-size="13" fill="#203047" font-weight="500"><tspan x="782" dy="0">5. Wrap Answer</tspan></text><path d="M 740.0 103 V 124 H 1265 V 148" fill="none" stroke="#5e7288" marker-end="url(#arr-2fa1770eca8f)"/><rect x="1110" y="150" width="310" height="150" rx="7" fill="#eaf2f9" stroke="#c9d9e7"/><text x="1123" y="173" font-size="14" fill="#203047" font-weight="600"><tspan x="1123" dy="0">Implicit Relationship Query</tspan></text><text x="1123" y="196" font-size="12" fill="#203047" font-weight="400"><tspan x="1123" dy="0">Use when: The question asks about a</tspan><tspan x="1123" dy="17">relationship or calculation not</tspan><tspan x="1123" dy="17">explicitly stated as a sentence but</tspan><tspan x="1123" dy="17">derivable from the context (e.g.,</tspan><tspan x="1123" dy="17">comparing values).</tspan></text><path d="M 1265 300 V 332" fill="none" stroke="#5e7288" marker-end="url(#arr-2fa1770eca8f)"/><rect x="1130" y="335" width="270" height="58" rx="7" fill="#f5f7fa" stroke="#cbd5df"/><text x="1142" y="357" font-size="13" fill="#203047" font-weight="500"><tspan x="1142" dy="0">1. Parse Question</tspan></text><path d="M 1265 393 V 408" fill="none" stroke="#5e7288" marker-end="url(#arr-2fa1770eca8f)"/><rect x="1130" y="411" width="270" height="58" rx="7" fill="#f5f7fa" stroke="#cbd5df"/><text x="1142" y="433" font-size="13" fill="#203047" font-weight="500"><tspan x="1142" dy="0">2. Search Context</tspan></text><path d="M 1265 469 V 484" fill="none" stroke="#5e7288" marker-end="url(#arr-2fa1770eca8f)"/><rect x="1130" y="487" width="270" height="58" rx="7" fill="#f5f7fa" stroke="#cbd5df"/><text x="1142" y="509" font-size="13" fill="#203047" font-weight="500"><tspan x="1142" dy="0">3. Extract Evidence</tspan></text><path d="M 1265 545 V 560" fill="none" stroke="#5e7288" marker-end="url(#arr-2fa1770eca8f)"/><rect x="1130" y="563" width="270" height="58" rx="7" fill="#f5f7fa" stroke="#cbd5df"/><text x="1142" y="585" font-size="13" fill="#203047" font-weight="500"><tspan x="1142" dy="0">4. Verify Evidence</tspan></text><path d="M 1265 621 V 636" fill="none" stroke="#5e7288" marker-end="url(#arr-2fa1770eca8f)"/><rect x="1130" y="639" width="270" height="58" rx="7" fill="#f5f7fa" stroke="#cbd5df"/><text x="1142" y="661" font-size="13" fill="#203047" font-weight="500"><tspan x="1142" dy="0">5. Formulate Answer</tspan></text><path d="M 1265 697 V 712" fill="none" stroke="#5e7288" marker-end="url(#arr-2fa1770eca8f)"/><rect x="1130" y="715" width="270" height="58" rx="7" fill="#f5f7fa" stroke="#cbd5df"/><text x="1142" y="737" font-size="13" fill="#203047" font-weight="500"><tspan x="1142" dy="0">6. Wrap Answer</tspan></text><text x="30" y="799" font-size="13" fill="#203047" font-weight="600"><tspan x="30" dy="0">Explicit conditions / named return edges (dashed):</tspan></text><text x="30" y="821" font-size="12" fill="#203047" font-weight="400"><tspan x="30" dy="0">Search Context: If multiple passages are relevant, prioritize the one with the most direct information.</tspan></text><text x="30" y="850" font-size="12" fill="#203047" font-weight="400"><tspan x="30" dy="0">Verify Evidence: If the evidence is ambiguous or partial, flag it for the next step.</tspan></text><text x="30" y="879" font-size="12" fill="#203047" font-weight="400"><tspan x="30" dy="0">Formulate Answer: Remove any context-specific references (e.g., &quot;According to the text...&quot;) unless necessary for clarity.</tspan></text><text x="30" y="908" font-size="12" fill="#203047" font-weight="400"><tspan x="30" dy="0">Wrap Answer: If no evidence was found, enclose &quot;Not found in context&quot; in the tags.</tspan></text></svg>