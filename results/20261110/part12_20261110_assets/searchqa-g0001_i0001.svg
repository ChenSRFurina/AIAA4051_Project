<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 945" role="img" aria-label="searchqa / g0001_i0001 / dev EM 73.33%" font-family="Arial, sans-serif"><defs><marker id="arr-9141cbcab3e2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5e7288"/></marker></defs><rect width="1120" height="945" fill="#ffffff"/><text x="28" y="32" font-size="20" fill="#203047" font-weight="600"><tspan x="28" dy="0">searchqa / g0001_i0001 / dev EM 73.33%</tspan></text><rect x="430.0" y="58" width="260" height="45" rx="7" fill="#173a59"/><text x="560.0" y="86" text-anchor="middle" fill="white" font-size="16">Task-type routing</text><path d="M 560.0 103 V 124 H 185 V 148" fill="none" stroke="#5e7288" marker-end="url(#arr-9141cbcab3e2)"/><rect x="30" y="150" width="310" height="133" rx="7" fill="#eaf2f9" stroke="#c9d9e7"/><text x="43" y="173" font-size="14" fill="#203047" font-weight="600"><tspan x="43" dy="0">Direct Evidence Question</tspan></text><text x="43" y="196" font-size="12" fill="#203047" font-weight="400"><tspan x="43" dy="0">Use when: The question asks for a</tspan><tspan x="43" dy="17">specific fact, entity, or phrase</tspan><tspan x="43" dy="17">explicitly stated in the context.</tspan></text><path d="M 185 283 V 315" fill="none" stroke="#5e7288" marker-end="url(#arr-9141cbcab3e2)"/><rect x="50" y="318" width="270" height="58" rx="7" fill="#f5f7fa" stroke="#cbd5df"/><text x="62" y="340" font-size="13" fill="#203047" font-weight="500"><tspan x="62" dy="0">1. Parse Question</tspan></text><path d="M 185 376 V 391" fill="none" stroke="#5e7288" marker-end="url(#arr-9141cbcab3e2)"/><rect x="50" y="394" width="270" height="58" rx="7" fill="#f5f7fa" stroke="#cbd5df"/><text x="62" y="416" font-size="13" fill="#203047" font-weight="500"><tspan x="62" dy="0">2. Search Context</tspan></text><path d="M 185 452 V 467" fill="none" stroke="#5e7288" marker-end="url(#arr-9141cbcab3e2)"/><rect x="50" y="470" width="270" height="58" rx="7" fill="#f5f7fa" stroke="#cbd5df"/><text x="62" y="492" font-size="13" fill="#203047" font-weight="500"><tspan x="62" dy="0">3. Extract Evidence</tspan></text><path d="M 185 528 V 543" fill="none" stroke="#5e7288" marker-end="url(#arr-9141cbcab3e2)"/><rect x="50" y="546" width="270" height="58" rx="7" fill="#f5f7fa" stroke="#cbd5df"/><text x="62" y="568" font-size="13" fill="#203047" font-weight="500"><tspan x="62" dy="0">4. Verify Evidence</tspan></text><path d="M 185 604 V 619" fill="none" stroke="#5e7288" marker-end="url(#arr-9141cbcab3e2)"/><rect x="50" y="622" width="270" height="58" rx="7" fill="#f5f7fa" stroke="#cbd5df"/><text x="62" y="644" font-size="13" fill="#203047" font-weight="500"><tspan x="62" dy="0">5. Formulate Answer</tspan></text><path d="M 185 680 V 695" fill="none" stroke="#5e7288" marker-end="url(#arr-9141cbcab3e2)"/><rect x="50" y="698" width="270" height="58" rx="7" fill="#f5f7fa" stroke="#cbd5df"/><text x="62" y="720" font-size="13" fill="#203047" font-weight="500"><tspan x="62" dy="0">6. Wrap Answer</tspan></text><path d="M 560.0 103 V 124 H 545 V 148" fill="none" stroke="#5e7288" marker-end="url(#arr-9141cbcab3e2)"/><rect x="390" y="150" width="310" height="133" rx="7" fill="#eaf2f9" stroke="#c9d9e7"/><text x="403" y="173" font-size="14" fill="#203047" font-weight="600"><tspan x="403" dy="0">Multi-Hop Reasoning Query</tspan></text><text x="403" y="196" font-size="12" fill="#203047" font-weight="400"><tspan x="403" dy="0">Use when: The question requires</tspan><tspan x="403" dy="17">combining information from different</tspan><tspan x="403" dy="17">parts of the context or inferring a</tspan><tspan x="403" dy="17">relationship between entities.</tspan></text><path d="M 545 283 V 315" fill="none" stroke="#5e7288" marker-end="url(#arr-9141cbcab3e2)"/><rect x="410" y="318" width="270" height="58" rx="7" fill="#f5f7fa" stroke="#cbd5df"/><text x="422" y="340" font-size="13" fill="#203047" font-weight="500"><tspan x="422" dy="0">1. Parse Question</tspan></text><path d="M 545 376 V 391" fill="none" stroke="#5e7288" marker-end="url(#arr-9141cbcab3e2)"/><rect x="410" y="394" width="270" height="58" rx="7" fill="#f5f7fa" stroke="#cbd5df"/><text x="422" y="416" font-size="13" fill="#203047" font-weight="500"><tspan x="422" dy="0">2. Search Context</tspan></text><path d="M 545 452 V 467" fill="none" stroke="#5e7288" marker-end="url(#arr-9141cbcab3e2)"/><rect x="410" y="470" width="270" height="58" rx="7" fill="#f5f7fa" stroke="#cbd5df"/><text x="422" y="492" font-size="13" fill="#203047" font-weight="500"><tspan x="422" dy="0">3. Extract Evidence</tspan></text><path d="M 545 528 V 543" fill="none" stroke="#5e7288" marker-end="url(#arr-9141cbcab3e2)"/><rect x="410" y="546" width="270" height="58" rx="7" fill="#f5f7fa" stroke="#cbd5df"/><text x="422" y="568" font-size="13" fill="#203047" font-weight="500"><tspan x="422" dy="0">4. Verify Evidence</tspan></text><path d="M 545 604 V 619" fill="none" stroke="#5e7288" marker-end="url(#arr-9141cbcab3e2)"/><rect x="410" y="622" width="270" height="58" rx="7" fill="#f5f7fa" stroke="#cbd5df"/><text x="422" y="644" font-size="13" fill="#203047" font-weight="500"><tspan x="422" dy="0">5. Formulate Answer</tspan></text><path d="M 545 680 V 695" fill="none" stroke="#5e7288" marker-end="url(#arr-9141cbcab3e2)"/><rect x="410" y="698" width="270" height="58" rx="7" fill="#f5f7fa" stroke="#cbd5df"/><text x="422" y="720" font-size="13" fill="#203047" font-weight="500"><tspan x="422" dy="0">6. Wrap Answer</tspan></text><path d="M 560.0 103 V 124 H 905 V 148" fill="none" stroke="#5e7288" marker-end="url(#arr-9141cbcab3e2)"/><rect x="750" y="150" width="310" height="133" rx="7" fill="#eaf2f9" stroke="#c9d9e7"/><text x="763" y="173" font-size="14" fill="#203047" font-weight="600"><tspan x="763" dy="0">Negative or Absence Query</tspan></text><text x="763" y="196" font-size="12" fill="#203047" font-weight="400"><tspan x="763" dy="0">Use when: The question asks for</tspan><tspan x="763" dy="17">information that might not be present,</tspan><tspan x="763" dy="17">asks for a negation, or implies an</tspan><tspan x="763" dy="17">absence in the context.</tspan></text><path d="M 905 283 V 315" fill="none" stroke="#5e7288" marker-end="url(#arr-9141cbcab3e2)"/><rect x="770" y="318" width="270" height="58" rx="7" fill="#f5f7fa" stroke="#cbd5df"/><text x="782" y="340" font-size="13" fill="#203047" font-weight="500"><tspan x="782" dy="0">1. Parse Question</tspan></text><path d="M 905 376 V 391" fill="none" stroke="#5e7288" marker-end="url(#arr-9141cbcab3e2)"/><rect x="770" y="394" width="270" height="58" rx="7" fill="#f5f7fa" stroke="#cbd5df"/><text x="782" y="416" font-size="13" fill="#203047" font-weight="500"><tspan x="782" dy="0">2. Search Context</tspan></text><path d="M 905 452 V 467" fill="none" stroke="#5e7288" marker-end="url(#arr-9141cbcab3e2)"/><rect x="770" y="470" width="270" height="58" rx="7" fill="#f5f7fa" stroke="#cbd5df"/><text x="782" y="492" font-size="13" fill="#203047" font-weight="500"><tspan x="782" dy="0">3. Verify Evidence</tspan></text><path d="M 905 528 V 543" fill="none" stroke="#5e7288" marker-end="url(#arr-9141cbcab3e2)"/><rect x="770" y="546" width="270" height="58" rx="7" fill="#f5f7fa" stroke="#cbd5df"/><text x="782" y="568" font-size="13" fill="#203047" font-weight="500"><tspan x="782" dy="0">4. Formulate Answer</tspan></text><path d="M 905 604 V 619" fill="none" stroke="#5e7288" marker-end="url(#arr-9141cbcab3e2)"/><rect x="770" y="622" width="270" height="58" rx="7" fill="#f5f7fa" stroke="#cbd5df"/><text x="782" y="644" font-size="13" fill="#203047" font-weight="500"><tspan x="782" dy="0">5. Wrap Answer</tspan></text><text x="30" y="782" font-size="13" fill="#203047" font-weight="600"><tspan x="30" dy="0">Explicit conditions / named return edges (dashed):</tspan></text><text x="30" y="804" font-size="12" fill="#203047" font-weight="400"><tspan x="30" dy="0">Search Context: If multiple passages are relevant, prioritize the one with the most direct information.</tspan></text><text x="30" y="833" font-size="12" fill="#203047" font-weight="400"><tspan x="30" dy="0">Verify Evidence: If the evidence is ambiguous, partial, or missing, flag it for the next step.</tspan></text><text x="30" y="862" font-size="12" fill="#203047" font-weight="400"><tspan x="30" dy="0">Formulate Answer: Remove any context-specific references (e.g., &quot;According to the text...&quot;) unless necessary for clarity.</tspan></text><text x="30" y="891" font-size="12" fill="#203047" font-weight="400"><tspan x="30" dy="0">Wrap Answer: If no evidence was found, enclose &quot;Not found in context&quot; in the tags.</tspan></text></svg>